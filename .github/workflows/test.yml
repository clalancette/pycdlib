name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flake8 mypy

    - name: Run flake8
      run: flake8 --ignore=E501,E266 pycdlib tools/*

    - name: Run mypy
      # Check against the oldest supported Python so newer-only stdlib and
      # typing features get flagged.
      run: mypy --ignore-missing-imports --python-version 3.10 -p pycdlib

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: 'true'

    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libbz2-dev libcap-dev libcdio-utils syslinux-utils util-linux zlib1g-dev

    # pytest has to come from pip rather than apt because it must be installed
    # into the matrix interpreter, not the system python.
    - name: Install pip dependencies
      run: python -m pip install pytest==9.2.0

    - name: Build patched cdrkit
      run: |
        tar -xf vendor/cdrkit-1.1.11-fedora40-patched.tar.gz -C vendor
        # cdrkit predates CMake 3.5; CMake 4 refuses its minimum version and
        # its request for the OLD CMP0015 behavior.
        sed -i '/cmake_policy(SET CMP0015 OLD)/d' vendor/cdrkit-1.1.11/CMakeLists.txt
        cmake -S vendor/cdrkit-1.1.11 -B vendor/cdrkit-1.1.11/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build vendor/cdrkit-1.1.11/build --parallel
        # Prepend (rather than replace) PATH so that the vendored genisoimage
        # and isovfy take precedence, while system tools like iso-read
        # (libcdio-utils) and isosize (util-linux) in /usr/bin stay visible.
        echo "$GITHUB_WORKSPACE/vendor/cdrkit-1.1.11/build/genisoimage" >> "$GITHUB_PATH"

    - name: Patch pycdlib-genisoimage for python version
      run: sed -i -e '0,/python3/s//python/' tools/pycdlib-genisoimage

    - name: Run tests
      run: pytest --verbose tests
      env:
        LD_LIBRARY_PATH: vendor/cdrkit-1.1.11/build/libusal/:vendor/cdrkit-1.1.11/build/librols
        PYCDLIB_TRACK_WRITES: 1
